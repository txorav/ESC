    <rect x="160" y="8" width="12" height="34" fill="#000" />
    <rect x="180" y="8" width="6" height="34" fill="#000" />
    <rect x="194" y="8" width="4" height="34" fill="#000" />
    <rect x="206" y="8" width="8" height="34" fill="#000" />
    <rect x="220" y="8" width="3" height="34" fill="#000" />
