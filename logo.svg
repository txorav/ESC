<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="escGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283FC3" />
      <stop offset="100%" stop-color="#111744" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#CD202A" />
      <stop offset="100%" stop-color="#A71017" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="112" fill="url(#escGrad)" stroke="url(#goldRing)" stroke-width="7" filter="url(#glow)"/>
  
  <!-- Inner Dashed Border -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Open Book Silhouette -->
  <path d="M 68 142 Q 94 132 120 142 Q 146 132 172 142 L 172 166 Q 146 156 120 166 Q 94 156 68 166 Z" fill="#F3E6C8" stroke="#CD202A" stroke-width="2"/>
  <path d="M 120 142 L 120 166" stroke="#CD202A" stroke-width="2"/>

  <!-- Central Monogram ESC -->
  <text x="120" y="112" font-family="'Fraunces', Georgia, serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">ESC</text>

  <!-- Subtitle Ribbon / Arc -->
  <text x="120" y="132" font-family="'Work Sans', sans-serif" font-weight="700" font-size="9" fill="#FFD700" text-anchor="middle" letter-spacing="3">ENGLISH SPEAKING CLUB</text>

  <!-- Established Year -->
  <circle cx="94" cy="184" r="2.5" fill="#CD202A"/>
  <text x="120" y="188" font-family="'Special Elite', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">EST. 2017</text>
  <circle cx="146" cy="184" r="2.5" fill="#CD202A"/>
</svg>
